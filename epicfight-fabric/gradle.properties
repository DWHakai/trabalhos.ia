org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true

# Minecraft / Fabric (https://fabricmc.net/develop/)
minecraft_version=1.21.1
parchment_version=2024.11.17
loader_version=0.16.14
# only for `-Pcompat` dev runs (GeckoLib and Controlify need it); the mod itself requires loader_version
compat_loader_version=0.17.3
fabric_api_version=0.116.17+1.21.1

# Forge Config API Port: lets the upstream ModConfigSpec code run on Fabric unchanged
forgeconfigapiport_version=21.1.6

# Mod
mod_id=epicfight
mod_version=21.17.3.1-fabric.0
maven_group=yesman.epicfight

# Upstream commit this port is based on (branch 1.21.1 of github.com/Epic-Fight/epicfight)
upstream_repo=https://github.com/Epic-Fight/epicfight.git
upstream_commit=a78aa24b72e90a9d09f5fd61925e4369d117abaf

# Optional integrations (compile only)
iris_version=1.8.8+1.21.1-fabric
sodium_version=mc1.21.1-0.6.13-fabric
controlify_version=2.5.0+1.21.1-fabric
yacl_version=3.8.1+1.21.1-fabric
geckolib_version=4.8.3
player_anim_version=2.0.4+1.21.1
shoulder_surfing_version=1.21.1-4.18.1+fabric
# Modrinth version ids of the Fabric files (the version numbers are shared with the NeoForge files)
first_person_model_version=zLOFFXwG
skinlayers_version=bb8Z5elg
